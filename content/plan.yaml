titulo: Consagración⇒Reconstrucción
subtitulo: Un plan devocional de 5 días para varones, basado en la historia de Nehemías
descripcion: >
  Cuando Nehemías supo que Jerusalén estaba en ruinas, primero se arrodilló y luego
  se puso en pie. Este devocional recorre cinco días —de lunes a viernes— para que,
  como él, aprendamos a reconstruir lo que está caído: primero de rodillas, luego
  con las manos en la obra.
inicio: 2026-09-28
fin: 2026-10-02
timezone: America/Caracas
cierre:
  titulo: Noche de Adoración de Hombres
  detalle: >
    Cierre de la semana con la Noche de Adoración de Hombres, «Consagración⇒Reconstrucción».
    Trae tu pacto escrito. Primero de rodillas, luego con las manos en la obra.
