titulo: Consagración⇒Reconstrucción
subtitulo: Un plan devocional de 5 días para hombres, basado en la historia de Nehemías
portada: /images/portada.png
descripcion: >
  Nehemías no era sacerdote ni profeta. Era un hombre común, con un trabajo secular, responsabilidades, presión y oposición. Vivía cómodo en el palacio del rey, pero no se acomodó. Cuando supo que su ciudad estaba en ruinas, no se quedó indiferente: lloró, oró, ayunó, planificó, trabajó y no se detuvo hasta ver los muros restaurados.
  Su vida inspira al hombre contemporáneo porque nos muestra que la consagración no es solo para religiosos o para personas “especiales”. Es para el varón que hoy enfrenta ruinas en su vida espiritual, su familia, su trabajo, sus finanzas o sus compromisos. Nehemías nos enseña a empezar de rodillas, a trabajar con excelencia, a resistir la burla y la distracción, y a hacer pacto con Dios hasta el final.
  Esta serie devocional nos prepara para la *Noche de Adoración para Hombres: “Consagración para la reconstrucción”*. No se trata solo de reconstruir muros: se trata de rendir el corazón a Dios y levantarnos como hombre consagrados. **Primero de rodillas, luego con las manos en la obra.**
inicio: 2026-09-28
fin: 2026-10-02
timezone: America/Caracas
