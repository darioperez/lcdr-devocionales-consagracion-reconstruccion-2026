titulo: Consagración⇒Reconstrucción
subtitulo: Un plan devocional de 5 días para hombres, basado en la historia de Nehemías
portada: /images/portada.jpeg
descripcion: >
  Nehemías, un hombre común con trabajo secular y responsabilidades, no se acomodó ante las ruinas: oró, trabajó y no se detuvo hasta restaurar los muros. Su vida inspira al hombre contemporáneo porque la consagración no es solo para aquellos con oficios religiosos, sino para todo varón que hoy enfrenta ruinas en su vida, familia o trabajo. Esta serie devocional nos prepara para la Noche de Adoración de Hombres: «Consagración⇒Reconstrucción», porque no se trata solo de reconstruir muros, sino de rendir el corazón a Dios y levantarnos como varones consagrados: primero de rodillas, luego las manos a la obra.
inicio: 2026-09-28
fin: 2026-10-02
timezone: America/Caracas
cierre:
  titulo: Noche de Adoración para Hombres
  detalle: >
    Cierre de la semana con la Noche de Adoración para Hombres, «Consagración⇒Reconstrucción».
    Trae tu pacto escrito. Primero de rodillas, luego las manos a la obra.
iglesia:
